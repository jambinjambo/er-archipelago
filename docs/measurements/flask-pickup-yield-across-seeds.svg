<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 350" width="736" height="350" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif">
<title id="t">What each flask pickup bought</title><desc id="d">One panel per configuration. Each bar is one Elden Ring slot of one generated multiworld, split by whether its flask pickups advanced charges, granted a Sacred Tear, or fell past both caps and granted nothing.</desc>
