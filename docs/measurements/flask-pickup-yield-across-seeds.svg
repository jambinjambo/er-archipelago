<text x="26.0" y="30.0" font-size="18" text-anchor="start" class="ink" font-weight="600">What each flask pickup bought</text>
<text x="26.0" y="50.0" font-size="12.5" text-anchor="start" class="ink2">One bar per Elden Ring slot, ordered by how many flask pickups that slot received.</text>
<text x="26.0" y="66.0" font-size="12.5" text-anchor="start" class="ink2">The flask holds only 22 upgrades, so pickups beyond that grant nothing at all.</text>
<text x="26.0" y="90.0" font-size="11.5" text-anchor="start" class="ink2">flask pickups received</text>
