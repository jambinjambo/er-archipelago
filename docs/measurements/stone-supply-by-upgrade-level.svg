<text x="26.0" y="30.0" font-size="18" text-anchor="start" class="ink" font-weight="600">Smithing stones in Elden Ring, by the level they reinforce</text>
<text x="26.0" y="50.0" font-size="12.5" text-anchor="start" class="ink2">Every stone that exists as a check, counted in stones rather than checks -- a bundled lot contributes all of its contents.</text>
<text x="26.0" y="66.0" font-size="12.5" text-anchor="start" class="ink2">A numbered tier reinforces three levels, so its bar spans three; the Ancient Dragon stones are the single-level top of each ladder.</text>
